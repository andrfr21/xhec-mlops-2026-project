[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xhec-mlops-project-student"
version = "0.0.1"
authors = [
  { name = "Francois Andreani", email = "francois.andreani@hec.edu" },
]
description = "X-HEC MLOps Project on Abalone age prediction model"
requires-python = ">=3.10,<3.12"
dependencies = [
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.17.2",
]
