[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xhec-mlops-project-student"
version = "0.0.1"
authors = [
  { name = "Francois Andreani", email = "francois.andreani@hec.edu" },
]
description = "X-HEC MLOps Project on Abalone age prediction model"
requires-python = ">=3.11,<3.12"
dependencies = [
    # fastapi 0.155 removed the **extra arguments of Body that prefect 3.9 still uses:
    # https://github.com/fastapi/fastapi/pull/16545
    "fastapi>=0.150.0,<0.155",
    "pandas>=2.3.3",
    "pandera>=0.34.1",
    "prefect>=3.8.8",
    "pydantic>=2.14.1",
    "scikit-learn>=1.7.2",
    # sqlalchemy 2.1 breaks the scheduler of the prefect server:
    # https://github.com/PrefectHQ/prefect/issues/23199
    "sqlalchemy<2.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "mlflow>=3.17.2",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "seaborn>=0.13.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
# module names start at the root of the repo (src.modelling..., src.web_service...)
explicit_package_bases = true

[[tool.mypy.overrides]]
# scikit-learn has no type hints
module = ["sklearn.*"]
ignore_missing_imports = true
