name: CI

# on pull requests, and on main after a merge (not twice for each PR)
on:
  push:
    branches: [main]
  pull_request:

# the CI only needs to read the code
permissions:
  contents: read

jobs:
  CI:
    name: Launching CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        # --locked: fail if uv.lock is not up to date with pyproject.toml
        run: uv sync --locked
      - name: Run pre-commit
        run: uv run pre-commit run --all-files
      - name: Run tests
        run: uv run pytest

  docker:
    name: Build the docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.app
          tags: abalone-api:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
